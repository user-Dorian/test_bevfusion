# 完整增强版 - 基于原版 convfuser.yaml 的最小修改
# 只修改 fuser 部分，启用 MultiScaleConvFuser
# 其他配置继承自 default.yaml

model:
  fuser:
    type: MultiScaleConvFuser
    in_channels: [80, 256]
    out_channels: 256
    attention_ratio: 16
  
  encoders:
    camera:
      vtransform:
        use_attention: true  # 启用 SEBlock
        
    lidar:
      backbone:
        use_cbam: false  # ❌ 先禁用 CBAM（通道数不匹配）
        # CBAM 需要适配 SparseEncoder 的输出通道
        # 如果使用 CBAM，需要修改 cbam.py 以支持动态通道数
