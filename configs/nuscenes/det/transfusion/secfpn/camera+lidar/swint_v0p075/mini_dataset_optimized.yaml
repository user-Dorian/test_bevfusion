# Mini Dataset Optimized Configuration for BEVFusion
# Target: +5 mAP improvement on mini dataset with 6 epochs

model:
  fuser:
    type: MultiScaleConvFuser
    in_channels: [80, 128]
    out_channels: 256
    attention_ratio: 16
  
  encoders:
    camera:
      backbone:
        type: SwinTransformer
        embed_dims: 96
        depths: [2, 2, 6, 2]
        num_heads: [3, 6, 12, 24]
        window_size: 7
        mlp_ratio: 4
        qkv_bias: true
        qk_scale: null
        drop_rate: 0.1
        attn_drop_rate: 0.
        drop_path_rate: 0.3
        patch_norm: true
        out_indices: [1, 2, 3]
        with_cp: false
        convert_weights: true
        init_cfg:
          type: Pretrained
          checkpoint: https://github.com/SwinTransformer/storage/releases/download/v1.0.0/swin_tiny_patch4_window7_224.pth
      
      neck:
        type: GeneralizedLSSFPN
        in_channels: [192, 384, 768]
        out_channels: 256
        start_level: 0
        num_outs: 3
        norm_cfg:
          type: GN
          num_groups: 32
          requires_grad: true
        act_cfg:
          type: SiLU
      
      vtransform:
        type: DepthLSSTransform
        in_channels: 256
        out_channels: 80
        image_size: [256, 704]
        feature_size: [32, 88]
        xbound: [-54.0, 54.0, 0.3]
        ybound: [-54.0, 54.0, 0.3]
        zbound: [-10.0, 10.0, 20.0]
        dbound: [1.0, 60.0, 0.5]
        downsample: 2
        depth_input: scalar
        add_depth_features: true
        height_expand: true
        point_feature_dims: 5
        use_attention: true
    
    lidar:
      voxelize:
        point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
        voxel_size: [0.075, 0.075, 0.2]
        max_voxels: [120000, 160000]
      
      backbone:
        sparse_shape: [1440, 1440, 41]
        output_channels: 128
        encoder_channels:
          - [16, 16, 32]
          - [32, 32, 64]
          - [64, 64, 128]
          - [128, 128]
        block_type: basicblock
  
  heads:
    object:
      type: TransFusionHead
      in_channels: 256
      hidden_channel: 256
      num_classes: 10
      
      train_cfg:
        grid_size: [1440, 1440, 41]
        point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
        voxel_size: [0.075, 0.075, 0.2]
        
        class_weights:
          - 1.0
          - 1.0
          - 1.5
          - 1.0
          - 1.2
          - 2.5
          - 3.0
          - 3.0
          - 3.5
          - 3.5
        
        loss_cls:
          type: FocalLoss
          use_sigmoid: true
          gamma: 2.0
          alpha: 0.25
          loss_weight: 1.5
        
        loss_bbox:
          type: SmoothL1Loss
          loss_weight: 1.8
        
        loss_heatmap:
          type: GaussianFocalLoss
          alpha: 2.0
          gamma: 4.0
          loss_weight: 1.5
      
      test_cfg:
        grid_size: [1440, 1440, 41]
        point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
        voxel_size: [0.075, 0.075, 0.2]
        score_threshold: 0.2
        post_center_limit_range: [-61.2, -61.2, -10.0, 61.2, 61.2, 10.0]
        nms_thr: 0.2
        max_per_img: 500

optimizer:
  lr: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

lr_config:
  policy: CosineAnnealing
  warmup: linear
  warmup_iters: 200
  warmup_ratio: 0.1
  min_lr_ratio: 0.05

clip_grad:
  max_norm: 35
  norm_type: 2

augment3d:
  scale: [0.85, 1.15]
  rotate: [-0.78539816, 0.78539816]
  translate: 0.8

data:
  samples_per_gpu: 2
  workers_per_gpu: 2
  
  train:
    dataset:
      pipeline:
        - type: ObjectPaste
          stop_epoch: 2
          db_sampler:
            dataset_root: data/nuscenes/
            info_path: data/nuscenes/nuscenes_dbinfos_train.pkl
            rate: 1.0
            prepare:
              filter_by_difficulty: [-1]
              filter_by_min_points:
                car: 5
                truck: 5
                bus: 5
                trailer: 5
                construction_vehicle: 5
                traffic_cone: 5
                barrier: 5
                motorcycle: 5
                bicycle: 5
                pedestrian: 5
            classes:
              - car
              - truck
              - construction_vehicle
              - bus
              - trailer
              - barrier
              - motorcycle
              - bicycle
              - pedestrian
              - traffic_cone
            sample_groups:
              car: 2
              truck: 3
              construction_vehicle: 7
              bus: 4
              trailer: 6
              barrier: 2
              motorcycle: 6
              bicycle: 6
              pedestrian: 2
              traffic_cone: 2
            points_loader:
              type: LoadPointsFromFile
              coord_type: LIDAR
              load_dim: 5
              use_dim: 5
              reduce_beams: 32
        
        - type: GlobalRotScaleTrans
          resize_lim: [0.85, 1.15]
          rot_lim: [-0.78539816, 0.78539816]
          trans_lim: 0.8
          is_train: true
        
        - type: RandomFlip3D
          flip_ratio_bev_horizontal: 0.5
          flip_ratio_bev_vertical: 0.5

train_cfg:
  max_epochs: 6
  val_interval: 1

checkpoint_config:
  interval: 1
  max_keep_ckpts: 3
  save_last: true

log_config:
  interval: 10
  hooks:
    - type: TextLoggerHook
    - type: TensorboardLoggerHook

evaluation:
  interval: 1
