# 深度增强的小目标检测优化配置
# 基于官方 default.yaml，添加 ConvFuser 和深度引导注意力机制
# 适用于 Mini 数据集验证（6 轮训练）

_base_: ./default.yaml

# ========== 模型配置（完整定义，避免配置合并问题）==========
model:
  # encoders 配置（保留 default.yaml 中的配置，只修改 vtransform）
  encoders:
    camera:
      vtransform:
        type: DepthLSSTransform
        in_channels: 256
        out_channels: 80
        image_size: [256, 704]
        feature_size: [32, 88]
        xbound: [-54.0, 54.0, 0.3]
        ybound: [-54.0, 54.0, 0.3]
        zbound: [-10.0, 10.0, 20.0]
        dbound: [1.0, 60.0, 0.5]
        downsample: 2
        depth_input: scalar
        # ✅ 深度增强配置
        add_depth_features: true
        point_feature_dims: 5
        use_attention: true
  
  # ✅ 添加 ConvFuser（带深度引导注意力）
  fuser:
    type: ConvFuser
    in_channels: [80, 256]
    out_channels: 256
    use_depth_attention: true
  
  # decoder 配置（基于官方 transfusion 配置）
  decoder:
    backbone:
      type: SECOND
      in_channels: 256
      out_channels: [128, 256]
      layer_nums: [5, 5]
      layer_strides: [1, 2]
      norm_cfg:
        type: BN
        eps: 1.0e-3
        momentum: 0.01
      conv_cfg:
        type: Conv2d
        bias: false
    neck:
      type: SECONDFPN
      in_channels: [128, 256]
      out_channels: [256, 256]
      upsample_strides: [1, 2]
      norm_cfg:
        type: BN
        eps: 1.0e-3
        momentum: 0.01
      upsample_cfg:
        type: deconv
        bias: false
      use_conv_for_no_stride: true
  
  # heads 配置
  heads:
    object:
      type: TransFusionHead
      num_proposals: 200
      attention: true
      hidden_channel: 128
      num_classes: 10
      num_decoder_layers: 3
      num_heads: 8
      learnable_querying: true
      dropout: 0.1
      activation: relu
      norm_cfg:
        type: LN
      init_cfg:
        - type: Normal
          layer: Linear
          std: 0.02
        - type: Xavier
          layer: Conv2d
          distribution: uniform
      train_cfg:
        dataset: nuscenes
        grid_size: [1440, 1440, 41]
        num_proposals: 200
        point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
        voxel_size: [0.075, 0.075, 0.2]
      test_cfg:
        dataset: nuscenes
        grid_size: [1440, 1440, 41]
        num_proposals: 200
        point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
        voxel_size: [0.075, 0.075, 0.2]

# ========== 数据增强 ==========
# 针对小目标的 Copy-Paste 增强
data:
  train:
    pipeline:
      - type: CopyPaste3D
        classes: ['pedestrian', 'motorcycle', 'bicycle', 'traffic_cone']
        max_num_pasted: 15
        paste_probability: 0.7

# ========== 预期提升 ==========
# 基线：mAP 0.308, NDS 0.374
# 目标：mAP 0.34+ (+10%), NDS 0.40+ (+7%)
# 小目标预期提升：
#   - Motorcycle: 0.20 → 0.30+ (+50%)
#   - Traffic Cone: 0.13 → 0.20+ (+54%)
#   - Pedestrian: 0.61 → 0.68+ (+11%)
