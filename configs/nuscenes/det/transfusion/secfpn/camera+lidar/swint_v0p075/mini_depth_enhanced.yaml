# 深度增强的小目标检测优化配置
# 基于官方 default.yaml，添加 ConvFuser 和深度引导注意力机制
# 适用于 Mini 数据集验证（6 轮训练）

_base_: ./default.yaml

# ========== 模型配置 ==========
model:
  # encoders 配置（保留 default.yaml 中的配置，只修改 vtransform）
  encoders:
    camera:
      vtransform:
        type: DepthLSSTransform
        in_channels: 256
        out_channels: 80
        image_size: [256, 704]
        feature_size: [32, 88]
        xbound: [-54.0, 54.0, 0.3]
        ybound: [-54.0, 54.0, 0.3]
        zbound: [-10.0, 10.0, 20.0]
        dbound: [1.0, 60.0, 0.5]
        downsample: 2
        depth_input: scalar
        # ✅ 深度增强配置
        add_depth_features: true
        point_feature_dims: 5
        use_attention: true
  
  # ✅ 添加 ConvFuser（带深度引导注意力）
  fuser:
    type: ConvFuser
    in_channels: [80, 256]
    out_channels: 256
    use_depth_attention: true

# ========== 数据增强 ==========
# 针对小目标的 Copy-Paste 增强（优化版：降低强度，避免过度增强）
data:
  train:
    pipeline:
      - type: CopyPaste3D
        classes: ['pedestrian', 'motorcycle', 'bicycle']  # 移除 traffic_cone，避免干扰
        max_num_pasted: 10  # 从 15 降到 10，避免过度拥挤
        paste_probability: 0.5  # 从 0.7 降到 0.5，更稳定的训练

# ========== 预期提升 ==========
# 基线：mAP 0.308, NDS 0.374
# 目标：mAP 0.34+ (+10%), NDS 0.40+ (+7%)
# 小目标预期提升：
#   - Motorcycle: 0.20 → 0.30+ (+50%)
#   - Traffic Cone: 0.13 → 0.20+ (+54%)
#   - Pedestrian: 0.61 → 0.68+ (+11%)
