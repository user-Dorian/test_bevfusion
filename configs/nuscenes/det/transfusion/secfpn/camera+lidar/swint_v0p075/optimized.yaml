# Optimized Configuration for BEVFusion Enhanced
# Based on analysis of training data and model architecture
# Target: Improve performance without causing training instability

_base_: "convfuser.yaml"

model:
  fuser:
    type: ConvFuser
    in_channels: [80, 256]
    out_channels: 256
  
  encoders:
    camera:
      backbone:
        drop_path_rate: 0.1  # Reduced from 0.2 to reduce overfitting
      
      vtransform:
        add_depth_features: true
        use_depth_classifier: true
        height_expand: true
        point_feature_dims: 5
        use_attention: true

# Keep training parameters stable to avoid oscillation
